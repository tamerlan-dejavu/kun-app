[project]
name = "kun-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1,<6",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.27",
    "django-environ>=0.11",
    "django-filter>=24.0",
    "django-ratelimit>=4.1",
    "django-storages[s3]>=1.14",
    "channels>=4.1",
    "channels-redis>=4.2",
    "daphne>=4.1",
    "celery[redis]>=5.4",
    "django-celery-beat>=2.7",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "Pillow>=10.4",
    "pywebpush>=2.0",
    "httpx>=0.27",
    "phonenumbers>=8.13",
    "sentry-sdk[django]>=2.0",
    "posthog>=3.6",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.24",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["config*", "apps*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
# DJ008 (__str__ у моделей): вернуть, когда у моделей-заглушек появятся поля
ignore = ["DJ008"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra"
