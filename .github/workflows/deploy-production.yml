name: Deploy production

# Релиз: develop -> PR в main -> на коммите в main ставим тег vX.Y.Z:
#   git switch main && git pull && git tag v1.0.0 && git push origin v1.0.0
# Выкладка ждёт ручного подтверждения (Required reviewers в Environment production).
on:
  push:
    tags: ["v*.*.*"]

# Права для вложенных workflow: пуш образов в GHCR. По умолчанию токен — только чтение.
permissions:
  contents: read
  packages: write

jobs:
  # Тег должен стоять на коммите из main — иначе можно выкатить непроверенную ветку
  tag-on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Тег указывает на коммит из main
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ok: ${GITHUB_REF_NAME} входит в main"
          else
            echo "::error::Тег ${GITHUB_REF_NAME} стоит на коммите, которого нет в main"
            exit 1
          fi

  ci:
    needs: tag-on-main
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      image_tag: ${{ github.ref_name }}
    secrets: inherit
