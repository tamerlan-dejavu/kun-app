name: CI

# Ветки:
#   feature/* --PR--> develop --PR--> main --тег vX.Y.Z--> production
#                        \--push--> staging
#   hotfix/* и release/* — PR в main (и обратно в develop)
#
# На PR запускается сам по себе. При выкладке вызывается из deploy-*.yml (workflow_call),
# чтобы выкладка шла только после зелёных проверок.
on:
  pull_request:
    branches: [develop, main]
  workflow_call:

# Новый push в PR отменяет устаревший прогон
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # В main — только из develop, release/* и hotfix/* (фичи идут через develop)
  branch-policy:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Проверка исходной ветки
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            develop|release/*|hotfix/*) echo "ok: $HEAD_REF -> main" ;;
            *) echo "::error::В main можно только из develop, release/* или hotfix/*, а не из '$HEAD_REF'"; exit 1 ;;
          esac

  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: kun
          POSTGRES_USER: kun
          POSTGRES_PASSWORD: kun
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgis://kun:kun@localhost:5432/kun
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y gdal-bin libgdal-dev
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
      - run: python manage.py spectacular --file openapi.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/openapi.yaml

  web:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: backend
      - name: Типы OpenAPI актуальны
        run: npm run gen:api && git diff --exit-code src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
