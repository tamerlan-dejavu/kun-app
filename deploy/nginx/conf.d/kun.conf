upstream web { server web:3000; }
upstream api { server api:8000; }
upstream ws  { server ws:8001; }

server {
  listen 80;
  server_name _;

  # TODO: в prod — редирект на HTTPS и server { listen 443 ssl; ... } с сертификатами Let's Encrypt
  location /.well-known/acme-challenge/ { root /var/www/certbot; }

  location /static/ { alias /var/www/static/; expires 30d; }

  location /api/   { proxy_pass http://api; include /etc/nginx/conf.d/proxy_params.inc; }
  location /admin/ { proxy_pass http://api; include /etc/nginx/conf.d/proxy_params.inc; }

  location /ws/ {
    proxy_pass http://ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    include /etc/nginx/conf.d/proxy_params.inc;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    include /etc/nginx/conf.d/proxy_params.inc;
  }
}
