user nginx;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # Лимит размера запроса (фото до 5 МБ)
  client_max_body_size 6m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Query string не логируем: телефоны и тексты в логи не пишутся
  log_format kun '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
  access_log /var/log/nginx/access.log kun;

  include /etc/nginx/conf.d/*.conf;
}
