# Базовый Compose: nginx, web, api, ws, worker, beat, db, redis.
# Запускать из корня репозитория, передавая корневой .env для подстановки ${...}:
#   dev:  docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up
#   prod: docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up -d
# (без --env-file compose ищет deploy/.env, а не корневой). Удобнее через make или deploy/scripts/.

name: kun-app

x-backend: &backend
  image: ${REGISTRY:-kun}/api:${IMAGE_TAG:-local}
  env_file: ../.env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static:/var/www/static:ro
    depends_on: [web, api, ws]
    restart: unless-stopped

  web:
    image: ${REGISTRY:-kun}/web:${IMAGE_TAG:-local}
    env_file: ../.env
    depends_on: [api]
    restart: unless-stopped

  api:
    <<: *backend
    command: gunicorn config.wsgi:application -b 0.0.0.0:8000 -w 3
    volumes:
      - static:/app/staticfiles

  ws:
    <<: *backend
    command: daphne -b 0.0.0.0 -p 8001 config.asgi:application

  worker:
    <<: *backend
    command: celery -A config worker -l info

  beat:
    <<: *backend
    command: celery -A config beat -l info

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kun}
      POSTGRES_USER: ${POSTGRES_USER:-kun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kun}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  static:
